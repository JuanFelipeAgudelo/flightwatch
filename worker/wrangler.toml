name = "flightwatch-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Poll every 20 minutes — plenty responsive for a delay/gate-change alert, and a
# ~4x cut in AeroDataBox quota usage versus every 5 minutes (see also: scheduled()
# stops polling a flight once it's landed, which matters far more at real scale).
[triggers]
crons = ["*/20 * * * *"]

[[kv_namespaces]]
binding = "FLIGHT_DATA"
id = "411ae9a0bf2a4ae2adcd3aea693360e6"

# Secrets (set via `wrangler secret put`, not stored here):
#   AERODATABOX_KEY  — RapidAPI key for AeroDataBox
#
# ntfy topics are no longer a secret: each private list gets its own auto-generated
# topic at registration time (see /api/register), stored in KV alongside the list.
